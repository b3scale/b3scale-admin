[package]
name = "b3scale-admin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
yew = "0.19"
yew-router = "0.16"
gloo = "0.8"
gloo-storage = "0.2"
gloo-console = "0.2"
gloo-net = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
jwt = "0.16"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1.0"
b3scale_api = { path = "./b3scale_api" }

