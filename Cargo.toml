[package]
name = "b3scale-admin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "b3scale_admin"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
gloo = "0.11"
gloo-storage = "0.3"
gloo-console = "0.3"
gloo-net = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
jsonwebtoken = "9.0"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1.0"
b3scale_api = { path = "./b3scale_api" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"

